# ================= Grid Bot v2 — конфигурация =================
# Каждый параметр объяснён в README, раздел «Настройка».

# true = виртуальные деньги (testnet.bybit.com). НАЧИНАЙ ТОЛЬКО ТАК.
testnet: true

# Торговая пара на споте
symbol: BTCUSDT

# Максимум USDT, который бот может задействовать. Жёсткий потолок.
budget_usdt: 500

# ---------- Сетка ----------
grid_range_pct: 5.0      # ширина сетки ±% от цены при построении
grid_levels: 10          # число уровней покупки

# ---------- Автономность ----------
# Цена ушла ВЫШЕ сетки -> перестроить сетку вокруг новой цены
rebuild_on_breakout_up: true
# Сколько опросов подряд цена должна быть вне сетки (защита от «фитилей»)
breakout_confirm_polls: 3

# Что делать после аварийной распродажи при пробое ВНИЗ:
#   stop    - остановиться и ждать тебя (безопаснее)
#   rebuild - подождать cooldown и построить новую сетку ниже (агрессивнее)
stop_action: stop
rebuild_cooldown_min: 30

# ---------- Защиты ----------
# Пробой вниз: цена ниже нижней границы сетки ещё на этот % -> распродажа
stop_loss_extra_pct: 3.0

# Максимальная просадка депозита от стартового капитала, %.
# Превышена -> полная остановка, распродажа, тревога. 0 = выкл.
max_drawdown_pct: 15.0

# Фильтр волатильности: средний размах 5-мин свечи за 2 часа, %.
# Выше порога -> бот НЕ строит новые сетки, ждёт успокоения. 0 = выкл.
volatility_max_pct: 1.2

# ---------- Сервис ----------
poll_interval_sec: 5     # частота опроса биржи
report_hour: 21          # час дневного отчёта в консоль (по времени телефона)

# ---------- Наблюдение прямо в консоли Termux ----------
# «Пульс»: строка цена / число ордеров / профит. 0 = выкл.
heartbeat_sec: 15
# Показ свежей свечи O/H/L/C — «какую свечку взял». 0 = выкл.
candle_log_sec: 60
candle_interval: "5"     # интервал показываемой свечи: 1 / 5 / 15 (минут)

# ---------- Веб-панель ----------
# Живая картина работы: http://localhost:8899 (только с этого устройства)
web_enabled: true
web_port: 8899
